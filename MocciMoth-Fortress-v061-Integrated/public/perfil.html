<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editar perfil — MocciMoth</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="perfil">
<header id="top"></header>
<main class="panel">
  <span class="tape"></span>
  <a class="back" href="/cuenta.html"><i data-icon="arrow-left"></i>Cuenta</a>
  <h1><i data-icon="pencil" class="i-xl"></i> Editar perfil</h1>
  <form id="f" class="form hidden" novalidate>
    <label class="field" data-f="nombre"><span class="lbl"><i data-icon="user" class="i-sm"></i>Nombre</span><input name="nombre" required maxlength="60"><span class="ferr"><i data-icon="circle-alert" class="i-sm"></i><em></em></span></label>
    <div class="form-2"><label class="field" data-f="telefono"><span class="lbl">Teléfono ficticio</span><input name="telefono" type="tel" maxlength="20"><span class="ferr"><i data-icon="circle-alert" class="i-sm"></i><em></em></span></label><label class="field" data-f="fecha_nacimiento"><span class="lbl">Fecha ficticia</span><input name="fecha_nacimiento" type="date"><span class="ferr"><i data-icon="circle-alert" class="i-sm"></i><em></em></span></label></div>
    <label class="field" data-f="direccion"><span class="lbl"><i data-icon="map-pin" class="i-sm"></i>Dirección ficticia</span><input name="direccion" maxlength="100"><span class="ferr"><i data-icon="circle-alert" class="i-sm"></i><em></em></span></label>
    <button class="btn" type="submit"><i data-icon="check"></i>Guardar</button>
  </form>
  <p id="msg" class="msg" role="status"></p>
</main>
<script src="/common.js"></script>
<script src="/account.js"></script>
</body>
</html>
